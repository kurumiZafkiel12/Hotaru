name: Flutter desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/hotaru
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if (-not $line) { throw 'version not found in pubspec.yaml' }
          $version = ($line -replace '^version:\s*', '') -replace '\+.*$', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "unexpected version: $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release --dart-define=HOTARU_RELEASE_TAG=v${{ steps.app_version.outputs.version }}-preview.${{ github.run_number }}
      - name: Bundle verified core
        id: bundle
        shell: pwsh
        run: |
          ../../packaging/windows/prepare-core.ps1 -BuildDir build/windows/x64/runner/Release
          ../../packaging/windows/prepare-node.ps1 -BuildDir build/windows/x64/runner/Release
          Invoke-WebRequest 'https://github.com/MetaCubeX/mihomo/archive/refs/tags/v1.19.33.zip' -OutFile mihomo-v1.19.33-source.zip
          foreach($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            Copy-Item (Join-Path $env:WINDIR "System32/$dll") build/windows/x64/runner/Release/
          }
      - name: Real Windows proxy loop
        run: dart run tool/proxy_loop_smoke.dart "${{ github.workspace }}/apps/hotaru/build/windows/x64/runner/Release/core/mihomo.exe"
      - name: Providers and four proxy groups
        run: dart run tool/providers_smoke.dart "${{ github.workspace }}/apps/hotaru/build/windows/x64/runner/Release/core/mihomo.exe"
      - name: Script overrides and timeout
        run: dart run tool/script_smoke.dart "${{ github.workspace }}/apps/hotaru/build/windows/x64/runner/Release/runtime/node.exe"
      - name: Crash guardian isolated registry tests
        run: dart run tool/guardian_smoke.dart "${{ github.workspace }}/apps/hotaru/build/windows/x64/runner/Release/Hotaru.Guardian.exe"
      - name: SCM service host isolated tests
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        shell: pwsh
        run: ../../packaging/windows/test-service.ps1 -BuildDir build/windows/x64/runner/Release
      - name: Build installer
        shell: pwsh
        run: |
          $compiler='C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if(-not (Test-Path $compiler)){throw 'Inno Setup missing'}
          & $compiler '/DAppVersion=${{ steps.app_version.outputs.version }}' '../../packaging/windows/Hotaru.iss'
          if($LASTEXITCODE -ne 0){throw 'Installer compilation failed'}
      - name: Isolated runner system proxy verification
        run: dart run tool/system_proxy_smoke.dart
      - name: Install and upgrade smoke
        shell: pwsh
        run: |
          ../../packaging/windows/test-installer.ps1
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../../dist/Hotaru-${{ steps.app_version.outputs.version }}-windows-x64-portable.zip
          Copy-Item mihomo-v1.19.33-source.zip ../../dist/
          $lines=Get-ChildItem ../../dist -File|ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()+'  '+$_.Name }
          $lines | Set-Content ../../dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hotaru-${{ steps.app_version.outputs.version }}-windows-x64
          path: dist/*
      - name: Publish Windows preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag='v${{ steps.app_version.outputs.version }}-preview.${{ github.run_number }}'
          $notes = Get-Content ../../docs/RELEASE-0.4.1.md -Raw
          $notes = $notes -replace '0\.4\.1', '${{ steps.app_version.outputs.version }}'
          $notes | Set-Content ../../docs/RELEASE-notes.md -NoNewline
          gh release create $tag ../../dist/* --target '${{ github.sha }}' --prerelease --title 'Hotaru ${{ steps.app_version.outputs.version }} Windows installer preview' --notes-file ../../docs/RELEASE-notes.md
