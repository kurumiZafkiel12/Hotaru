name: Inspect replacement release
on:
  push:
    branches: ['codex/h005-release-inspection']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read failing installation log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import io, json, subprocess, zipfile
          from pathlib import Path
          paths = [
              'repos/kurumiZafkiel12/Hotaru/actions/jobs/122849734634/logs',
              'repos/kurumiZafkiel12/Hotaru/actions/runs/40694805898/logs',
          ]
          results = []
          for path in paths:
              result = subprocess.run(['gh', 'api', path], capture_output=True)
              entry = {'endpoint': path, 'code': result.returncode, 'error': result.stderr.decode(errors='replace')[-2000:]}
              if result.returncode == 0:
                  try:
                      archive = zipfile.ZipFile(io.BytesIO(result.stdout))
                      entry['logs'] = {name: archive.read(name).decode(errors='replace')[-16000:] for name in archive.namelist() if 'windows-install' in name.lower()}
                  except zipfile.BadZipFile:
                      entry['log'] = result.stdout.decode(errors='replace')[-16000:]
              results.append(entry)
          Path('diagnostic.json').write_text(json.dumps({'source_run': '40694805898', 'results': results}, indent=2))
          PYCODE
      - name: Save diagnostic for the cloud checkout
        run: |
          git config user.name 'Hotaru release CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blob=$(git hash-object -w diagnostic.json)
          tree=$(printf '100644 blob %s\tdiagnostic.json\n' "$blob" | git mktree)
          parent=$(git ls-remote origin refs/heads/ci/release-diagnostics/v0.0.5 | cut -f1)
          if test -n "$parent"; then
            git fetch origin refs/heads/ci/release-diagnostics/v0.0.5
            commit=$(printf 'chore(release): save installation diagnostic\n' | git commit-tree "$tree" -p "$parent")
          else
            commit=$(printf 'chore(release): save installation diagnostic\n' | git commit-tree "$tree")
          fi
          git push origin "$commit:refs/heads/ci/release-diagnostics/v0.0.5"
