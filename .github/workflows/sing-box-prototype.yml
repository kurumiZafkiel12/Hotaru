name: Sing-box P0 prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/hotaru/tool/sing_box_probe.py
      - apps/hotaru/tool/sing_box_adapter_smoke.dart
      - apps/hotaru/tool/sing_box_lifecycle_smoke.dart
      - apps/hotaru/tool/sing_box_tun_smoke.dart
      - apps/hotaru/tool/sing_box_owner_loss_smoke.dart
      - apps/hotaru/tool/sing_box_helper_probe.ps1
      - apps/hotaru/tool/sing_box_flutter_helper_probe.ps1
      - apps/hotaru/tool/build_sing_box_bundle.ps1
      - apps/hotaru/test/core/sing_box/helper_native_test.dart
      - apps/hotaru/test/core/sing_box/clash_subscription_test.dart
      - apps/hotaru/test/core/sing_box/clash_rule_sets_test.dart
      - apps/hotaru/test/core/sing_box/ip_rule_test.dart
      - apps/hotaru/test/core/sing_box/config_preparation_test.dart
      - apps/hotaru/test/core/sing_box/route_preview_session_test.dart
      - apps/hotaru/test/core/sing_box/routing_mode_test.dart
      - apps/hotaru/test/core/sing_box/outbound_clients_test.dart
      - apps/hotaru/test/core/sing_box/ui_handler_test.dart
      - apps/hotaru/test/core/sing_box/ui_routes_test.dart
      - apps/hotaru/test/core/sing_box/yaml_document_test.dart
      - apps/hotaru/test/core/sing_box/share_links_test.dart
      - apps/hotaru/test/core/sing_box/inbound_state_test.dart
      - apps/hotaru/test/core/sing_box/proxy_definitions_test.dart
      - apps/hotaru/test/core/sing_box/node_definition_test.dart
      - apps/hotaru/test/core/sing_box/support/windows_process_witness.dart
      - apps/hotaru/lib/common/yaml.dart
      - apps/hotaru/test/core/sing_box/detour_test.dart
      - apps/hotaru/test/core/sing_box/outbound_http_test.dart
      - apps/hotaru/test/core/sing_box/loopback_proxy_fixture.dart
      - apps/hotaru/test/core/sing_box/support/tls/**
      - apps/hotaru/lib/core/outbound_http.dart
      - apps/hotaru/lib/core/controller.dart
      - apps/hotaru/lib/core/profile_documents.dart
      - apps/hotaru/test/core/profile_documents_test.dart
      - apps/hotaru/lib/common/speed_test.dart
      - apps/hotaru/lib/views/proxies/card.dart
      - apps/hotaru/test/widgets/node_speed_route_test.dart
      - apps/hotaru/lib/core/telemetry.dart
      - apps/hotaru/test/core/sing_box/telemetry_test.dart
      - apps/hotaru/test/core/desktop/configuration_lifecycle_test.dart
      - apps/hotaru/test/core/sing_box/pipe_connection_test.dart
      - apps/hotaru/test/core/sing_box/dns_config_test.dart
      - apps/hotaru/test/core/sing_box/dns_wire_test.dart
      - apps/hotaru/core/sing_box_host/**
      - apps/hotaru/services/helper/**
      - apps/hotaru/lib/core/desktop/core_manifest.dart
      - apps/hotaru/lib/core/adapter.dart
      - apps/hotaru/lib/core/routing_mode.dart
      - apps/hotaru/lib/core/outbound_http.dart
      - apps/hotaru/lib/core/config/**
      - apps/hotaru/lib/core/sing_box/**
      - apps/hotaru/lib/core/desktop/connection.dart
      - apps/hotaru/lib/core/desktop/lifecycle.dart
      - apps/hotaru/lib/core/desktop/listener_owner.dart
      - apps/hotaru/lib/core/desktop/model.dart
      - apps/hotaru/lib/core/desktop/process_lease.dart
      - .github/workflows/sing-box-prototype.yml

permissions:
  contents: read

jobs:
  controlled-routing:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Fetch and verify pinned upstream binary
        shell: pwsh
        run: |
          $asset = Join-Path $env:RUNNER_TEMP 'sing-box.zip'
          Invoke-WebRequest 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip' -OutFile $asset
          $expected = '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df'
          if ((Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Upstream sing-box asset digest mismatch'
          }
          Expand-Archive $asset -DestinationPath (Join-Path $env:RUNNER_TEMP 'sing-box')
      - name: Verify actual selected outbound with loopback receipts
        shell: pwsh
        working-directory: apps/hotaru
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'sing-box/sing-box-1.14.4-windows-amd64/sing-box.exe'
          python tool/sing_box_probe.py --binary $binary --dart (Get-Command dart).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  desktop-host-tun:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/hotaru/core/sing_box_host/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Verify and build pinned desktop host
        working-directory: apps/hotaru
        shell: pwsh
        run: |
          go -C core/sing_box_host mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C core/sing_box_host test -mod=readonly -tags with_clash_api,with_quic,with_utls ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C core/sing_box_host build -mod=readonly -tags with_clash_api,with_quic,with_utls -o "$env:RUNNER_TEMP/hotaru-box-host.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real TUN packet routes and graceful resource cleanup
        working-directory: apps/hotaru
        shell: pwsh
        run: |
          python tool/sing_box_probe.py --binary "$env:RUNNER_TEMP/hotaru-box-host.exe" --dart (Get-Command dart).Source --stdio-host --tun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real Windows named pipe bootstrap and TUN packets
        working-directory: apps/hotaru
        shell: pwsh
        run: |
          ./tool/sing_box_helper_probe.ps1 -Binary "$env:RUNNER_TEMP/hotaru-box-host.exe"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/hotaru/services/helper -> target
      - name: Build isolated Helper against the exact host digest
        working-directory: apps/hotaru
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'hotaru-helper-probe'
          ./tool/build_sing_box_bundle.ps1 -Destination $stage
      - name: Verify real SCM Helper identity, TUN packets and cleanup
        working-directory: apps/hotaru
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'hotaru-helper-probe'
          ./tool/sing_box_helper_probe.ps1 -Binary "$stage/HotaruCore.exe" -HelperPath "$stage/HotaruHelperService.exe"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Prepare isolated Flutter native test dependencies
        working-directory: apps/hotaru
        shell: pwsh
        run: |
          $source = Get-Content -Raw pubspec.yaml
          $source = $source.Replace("setup:`n      build_assets: true", "setup:`n      build_assets: false")
          $source = $source.Replace("setup:`r`n      build_assets: true", "setup:`r`n      build_assets: false")
          if ($source -notmatch 'setup:\r?\n      build_assets: false') { throw 'Isolated setup hook was not disabled' }
          Set-Content -NoNewline -Encoding utf8 pubspec.yaml $source
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = Join-Path $env:RUNNER_TEMP 'sing-box-dns.zip'
          Invoke-WebRequest 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip' -OutFile $asset
          if ((Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant() -ne '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df') {
            throw 'DNS test engine digest mismatch'
          }
          Expand-Archive $asset -DestinationPath (Join-Path $env:RUNNER_TEMP 'sing-box-dns')
          $env:HOTARU_TEST_SING_BOX = Join-Path $env:RUNNER_TEMP 'sing-box-dns/sing-box-1.14.4-windows-amd64/sing-box.exe'
          flutter test test/core/sing_box/node_definition_test.dart test/core/sing_box/proxy_definitions_test.dart test/core/sing_box/inbound_state_test.dart test/core/sing_box/share_links_test.dart test/core/profile_documents_test.dart test/core/spill_test.dart test/core/sing_box/yaml_document_test.dart test/core/sing_box/ui_routes_test.dart test/core/sing_box/outbound_clients_test.dart test/core/sing_box/ui_handler_test.dart test/core/sing_box/routing_mode_test.dart test/core/sing_box/telemetry_test.dart test/core/sing_box/outbound_http_test.dart test/core/sing_box/detour_test.dart test/core/sing_box/route_preview_session_test.dart test/core/desktop/configuration_lifecycle_test.dart test/core/desktop/lifecycle_test.dart test/core/sing_box/config_preparation_test.dart test/core/sing_box/pipe_connection_test.dart test/core/sing_box/ip_rule_test.dart test/core/sing_box/clash_rule_sets_test.dart test/core/sing_box/clash_subscription_test.dart test/core/sing_box/clash_importer_test.dart test/core/sing_box/config_builder_test.dart test/core/sing_box/dns_config_test.dart test/core/sing_box/dns_wire_test.dart --reporter expanded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify two real proxy hops through the packaged host
        working-directory: apps/hotaru
        shell: pwsh
        run: |
          $env:HOTARU_TEST_SING_BOX = Join-Path $env:RUNNER_TEMP 'hotaru-helper-probe/HotaruCore.exe'
          $env:HOTARU_TEST_SING_BOX_HOST = '1'
          flutter test test/core/sing_box/inbound_state_test.dart test/core/sing_box/routing_mode_test.dart test/core/sing_box/outbound_http_test.dart test/core/sing_box/detour_test.dart --plain-name 'real engine' --reporter expanded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:HOTARU_TEST_SING_BOX_HOST
      - name: Verify real Flutter Rust IPC through SYSTEM Helper
        working-directory: apps/hotaru
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'hotaru-helper-probe'
          ./tool/sing_box_flutter_helper_probe.ps1 -Bundle $stage
