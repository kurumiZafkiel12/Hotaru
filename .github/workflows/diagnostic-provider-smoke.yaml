name: Diagnostic provider survey

on:
  push:
    branches: ['codex/v005-from-v004', 'codex/v006-windows']
    paths:
      - '.github/workflows/diagnostic-provider-smoke.yaml'
      - 'apps/hotaru/tool/diagnostic_provider_smoke.py'
      - 'apps/hotaru/tool/browser_diagnostic_smoke.py'
      - 'apps/hotaru/lib/common/dns_leak.dart'
      - 'apps/hotaru/lib/common/ip_portrait.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Observe public providers from the runner network
        run: python apps/hotaru/tool/diagnostic_provider_smoke.py "$RUNNER_TEMP/providers.json"
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-provider-observations
          path: ${{ runner.temp }}/providers.json
          retention-days: 14
      - name: Install isolated browser reference runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Observe live reference page detection
        run: python apps/hotaru/tool/browser_diagnostic_smoke.py "$RUNNER_TEMP/browser-reference.json"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-reference-observations
          path: ${{ runner.temp }}/browser-reference.json
          retention-days: 14
