name: Import Hotaru 0.5.0 fork tree (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download rebranded fork tree
        run: |
          curl -L -o /tmp/fork.zip "https://muse.ai/files/1340370602499947/4757612734561225/0avr7849b6vilvarqe8v847d/Hotaru-fork-0.5.0-rebrand.zip"
          mkdir -p /tmp/fork
          unzip -q /tmp/fork.zip -d /tmp/fork
          grep -E "^(name|version):" /tmp/fork/Hotaru-fork/pubspec.yaml

      - name: Replace tree on a new branch and tag it
        run: |
          git config user.name "kurumiZafkiel12"
          git config user.email "kurumiZafkiel12@users.noreply.github.com"
          git checkout -b muse/hotaru-v050-fork
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/fork/Hotaru-fork/. .
          rm -f core/Clash.Meta/.git
          # GITHUB_TOKEN can never carry a `workflows` permission (GitHub's
          # workflow permissions list has no such key), so a push containing
          # new workflow files is always rejected. Keep workflow files out
          # of this commit; they are added to the branch afterwards from a
          # user session, and the tag is created only after that.
          rm -rf .github/workflows
          git add -A
          git rm -r --cached core/Clash.Meta
          git update-index --add --cacheinfo 160000,c5062921054902b25215a6a933e72ccd714c9bfa,core/Clash.Meta
          git commit -m "Hotaru 0.5.0: fork FlClash 0.9.2, rebrand to Hotaru"
          git push origin HEAD:refs/heads/muse/hotaru-v050-fork
