name: Android v0.0.2 supplement

on:
  push:
    branches: [codex/hotaru-v002-android]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-v002-supplement
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check v0.0.2 source boundary
        run: |
          test "$(sed -n 's/^version: //p' pubspec.yaml)" = '0.0.2+11'
          git diff --exit-code 39abb5a80dda2495d4a8a521202aea9f8ec88d2b -- lib core android plugins pubspec.yaml pubspec.lock setup.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify retained build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40316190743" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/121549267473" > "$RUNNER_TEMP/source-job.json"
          python3 - "$RUNNER_TEMP/source-run.json" "$RUNNER_TEMP/source-job.json" <<'PYVERIFY'
          import json, sys
          run = json.load(open(sys.argv[1]))
          job = json.load(open(sys.argv[2]))
          assert run['head_sha'] == '686370710bd5d77150acaf8e3de7df5304099569'
          assert any(step['name'] == 'Package Android' and step['conclusion'] == 'success' for step in job['steps'])
          PYVERIFY

      - name: Restore built APKs for the unchanged application source
        uses: actions/download-artifact@v4
        with:
          name: android-v002-raw
          run-id: 40316190743
          github-token: ${{ github.token }}
          path: dist/

      - name: Inspect APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android-release
          python3 tool/release_android_v002.py inspect

      - uses: actions/upload-artifact@v4
        with:
          name: android-v002-verified
          path: android-release/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-v002-raw
          path: dist/**/*.apk

  publish:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-v002-verified
          path: android-release/

      - name: Verify passing checks for the unchanged application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40313812043" > "$RUNNER_TEMP/checks.json"
          python3 - "$RUNNER_TEMP/checks.json" <<'PYVERIFY'
          import json, sys
          run = json.load(open(sys.argv[1]))
          assert run['head_sha'] == '80717a1d6dd7694c8570fd21b8133ad9fa36eadc'
          assert run['conclusion'] == 'success'
          PYVERIFY

      - name: Supplement existing v0.0.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release_android_v002.py publish
