name: Windows release

on:
  push:
    branches:
      - 'release/windows/**'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$/\1/p' apps/hotaru/pubspec.yaml)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "release/windows/v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  publish:
    needs: version
    uses: ./.github/workflows/build.yaml
    with:
      release_version: ${{ needs.version.outputs.version }}
    secrets: inherit
